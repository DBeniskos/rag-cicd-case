name: deploy

# Selects an already-published release and puts it in one environment.
#
# It builds nothing. The image being deployed was produced by release.yml, and this workflow
# resolves the tag to a digest so that promoting dev -> prod provably moves the same bytes
# rather than rebuilding from the same source and hoping.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release to deploy, e.g. v0.1.0"
        required: true
        type: string
      environment:
        description: "Target environment"
        required: true
        type: choice
        options:
          - dev
          - prod

permissions:
  contents: read

# Two deployments to one environment at once would race on Terraform state and on the ECS service.
# Different environments may proceed in parallel.
concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy · ${{ inputs.version }} → ${{ inputs.environment }}
    runs-on: ubuntu-latest

    # The GitHub environment is not decoration: the deploy role's trust policy is scoped to the
    # environment claim, so the approval gate on `prod` sits in front of the AWS credentials
    # themselves, not merely in front of the job.
    environment:
      name: ${{ inputs.environment }}
      url: ${{ steps.deploy.outputs.api_url }}

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"
          terraform_wrapper: false # the scripts read `terraform output -raw`

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # backend.hcl is gitignored because it names the account, so it is rebuilt from variables.
      - name: Reconstruct backend config
        shell: bash
        run: |
          cat > infra/backend.hcl <<EOF
          bucket       = "${{ vars.TF_STATE_BUCKET }}"
          region       = "${{ vars.AWS_REGION }}"
          encrypt      = true
          use_lockfile = true
          EOF

      - name: Deploy
        id: deploy
        shell: bash
        env:
          ENV: ${{ inputs.environment }}
          VERSION: ${{ inputs.version }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          bash scripts/deploy.sh
          api_url="$(terraform -chdir="infra/envs/${ENV}" output -raw api_url)"
          echo "api_url=$api_url" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # /ask is authenticated, so the gate needs the key. Masked before it can reach any log, and
      # never written to a file or an artifact.
      - name: Fetch the API key
        shell: bash
        env:
          ENV: ${{ inputs.environment }}
        run: |
          secret_name="$(terraform -chdir="infra/envs/${ENV}" output -raw api_key_secret_name)"
          key="$(aws secretsmanager get-secret-value \
            --secret-id "$secret_name" --query SecretString --output text)"
          echo "::add-mask::$key"
          echo "RAG_API_KEY=$key" >> "$GITHUB_ENV"

      # smoke.sh already proved the right *bytes* are serving. This proves the right *answers*
      # are. A release can pass every unit test, deploy cleanly and still degrade retrieval —
      # a prompt change or an embedding-model bump does exactly that — so the gate runs against
      # the live environment rather than an in-process app.
      #
      # It runs after traffic has shifted, which is a deliberate trade. Gating a rolling update
      # before the shift is not possible without a second endpoint, so dev catches the regression;
      # in prod the canary alarms bound the exposure and rollback (docs/runbook.md) is the remedy.
      - name: Eval gate
        id: eval
        shell: bash
        env:
          BASE_URL: ${{ steps.deploy.outputs.api_url }}
          ENV: ${{ inputs.environment }}
        run: |
          python eval/run_eval.py \
            --base-url "$BASE_URL" \
            --env "$ENV" \
            --json-out "eval-report.json" \
            --summary-out "$GITHUB_STEP_SUMMARY"

      # Uploaded on failure too: the report is the evidence for the rollback decision, and it is
      # the first thing anyone asks for.
      - name: Upload eval report
        if: always() && steps.eval.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: eval-${{ inputs.environment }}-${{ inputs.version }}
          path: eval-report.json
          if-no-files-found: ignore

      - name: Summarise
        if: always()
        shell: bash
        env:
          ENV: ${{ inputs.environment }}
          VERSION: ${{ inputs.version }}
        run: |
          {
            echo "### Deploy \`${VERSION}\` → \`${ENV}\`"
            echo ""
            echo "| | |"
            echo "| --- | --- |"
            echo "| result | ${{ job.status }} |"
            echo "| url | ${{ steps.deploy.outputs.api_url }} |"
            echo ""
            if [ "${{ job.status }}" != "success" ]; then
              echo "Roll back with: \`deploy.yml\` at the previous version, or"
              echo "\`index.yml\` action \`rollback\` if the eval gate failed on retrieval."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
