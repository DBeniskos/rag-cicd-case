# Quality gates for the eval harness.
#
# These are release criteria, not aspirations. A number here that nothing can ever fail is
# decoration; a number that fails constantly gets overridden and then ignored. Both are worse
# than no gate at all, so each threshold below sits just under what the current corpus and model
# actually sustain, and is raised deliberately rather than drifting upward.
#
# TOML rather than YAML so the harness parses it with stdlib `tomllib`. The eval gate runs in the
# deploy pipeline on a bare Python setup with no dependency install step, which keeps a network
# failure from pip out of the release path.
#
# The gate is intentionally deterministic — string containment and retrieval position, not an
# LLM judge. See docs/adr/0006-eval-gate-is-deterministic.md.

[defaults]
# Did the expected source document come back in the retrieved passages at all?
# Retrieval is the failure mode a bad index actually produces, so it is gated hardest.
recall_at_k = 0.90

# Of the answers to in-corpus questions, how many contained an expected key term?
# Catches a model that retrieves correctly and then answers from its own weights.
answer_match_rate = 0.80

# Out-of-corpus questions must be refused. A RAG service that improvises is the risk the gate
# exists to catch, so this one tolerates no misses.
refusal_rate = 1.00

# Any non-2xx from /ask, or a malformed body.
max_error_rate = 0.00

# End-to-end, measured client-side, so it includes retrieval, Bedrock and the network.
max_p95_latency_ms = 12000

# Dev exists to find failures early, so it runs the same checks with more tolerance for a cold
# Fargate task and an unwarmed model.
[environments."nonprod/dev"]
max_p95_latency_ms = 20000
answer_match_rate = 0.70

[environments."nonprod/stage"]
max_p95_latency_ms = 15000

[environments.prod]
recall_at_k = 0.90
answer_match_rate = 0.80
max_p95_latency_ms = 10000
