# Quality gates for the eval harness.
#
# These are release criteria, not aspirations. A number here that nothing can ever fail is
# decoration; a number that fails constantly gets overridden and then ignored. Both are worse
# than no gate at all, so each threshold below is set just under the level the current corpus
# and model actually sustain, and is raised deliberately rather than drifting upward.
#
# The gate is intentionally deterministic — string containment and retrieval position, not an
# LLM judge. A judge model would make the gate itself non-reproducible and would add a second
# model's availability to the release path. Semantic scoring belongs in offline quality review,
# not in the block/allow decision. See docs/adr/0006-eval-gate-is-deterministic.md.

defaults:
  # Did the expected source document come back in the retrieved passages at all?
  # Retrieval is the failure mode that a bad index actually produces, so it is gated hardest.
  recall_at_k: 0.90

  # Of the answers to in-corpus questions, how many contained an expected key term?
  # Catches a model that retrieves correctly and then answers from its own weights.
  answer_match_rate: 0.80

  # Out-of-corpus questions must be refused. A RAG service that improvises is the risk
  # the gate exists to catch, so this one does not tolerate misses.
  refusal_rate: 1.00

  # Any non-2xx from /ask, or a malformed body.
  max_error_rate: 0.00

  # End-to-end, measured client-side, so it includes retrieval, Bedrock and the network.
  max_p95_latency_ms: 12000

# Dev exists to find failures early, so it runs the same checks with a little more tolerance
# for a cold Fargate task and an unwarmed model.
environments:
  nonprod/dev:
    max_p95_latency_ms: 20000
    answer_match_rate: 0.70

  nonprod/stage:
    max_p95_latency_ms: 15000

  prod:
    recall_at_k: 0.90
    answer_match_rate: 0.80
    max_p95_latency_ms: 10000
